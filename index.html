<!doctype html>
<html lang="en" data-theme="rlme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Map Editor</title>
<meta name="theme-color" content="#1a1d23">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
<style type="text/tailwindcss">
  @theme inline {
    --color-base-100: var(--color-base-100); --color-base-200: var(--color-base-200); --color-base-300: var(--color-base-300);
    --color-base-content: var(--color-base-content); --color-primary: var(--color-primary); --color-primary-content: var(--color-primary-content);
    --color-neutral: var(--color-neutral); --color-neutral-content: var(--color-neutral-content);
    --color-success: var(--color-success); --color-warning: var(--color-warning); --color-error: var(--color-error); --color-info: var(--color-info);
  }
  /* parts the script builds or re-classes, so it keeps plain class names */
  /* the picked one of a set (tool, join, tab) reads at a glance */
  .btn.active, .tabs-box .tab.tab-active { @apply bg-primary/15 text-primary border-primary/40 shadow-none; }
  .tabs-box .tab:not(.tab-active) { @apply text-base-content/60 hover:text-base-content; }
  .btn:disabled { @apply bg-transparent border-transparent text-base-content/25; }
  header .btn { @apply whitespace-nowrap shrink-0; }
  .join > .active { @apply relative z-[3]; }       /* above its neighbours, even a focused one (daisyUI lifts those to 2), whose edge would cover its border */
  /* no focus rings anywhere: a focused field keeps its resting border */
  :focus, :focus-visible, :focus-within { outline: none !important; }   /* !important: daisyUI's own focus rules are more specific */
  .input:focus, .input:focus-within, .select:focus, .select:focus-within, .select:open, .textarea:focus, .textarea:focus-within {
    --input-color: color-mix(in oklab, var(--color-base-content) 20%, #0000); box-shadow: none; outline: none;
  }
  ::selection { @apply bg-primary/35; }
  * { scrollbar-width: thin; scrollbar-color: var(--color-neutral) transparent; }
  /* inspector: sections, and rows of a label column then one field or three */
  .section { @apply flex flex-col gap-2 border-t border-base-300 pt-3; }
  .section > h3 { @apply m-0 text-[11px] font-semibold uppercase tracking-wider text-base-content/60; }
  .actions { @apply flex gap-2 border-t border-base-300 pt-3; }
  .section:not(:has(> :not(h3):not([hidden]))), .actions:not(:has(> :not([hidden]))) { display: none; }
  .field { @apply grid grid-cols-[5rem_1fr] items-center gap-2 text-base-content/60; }
  .vec { @apply grid grid-cols-[5rem_repeat(3,minmax(0,1fr))] items-center gap-1 text-base-content/60; }
  .check { @apply flex cursor-pointer items-center gap-2; }
  #selEdit .check { @apply ml-22; }               /* under the fields, past the label column */
  #app:has(#scriptPanel:not([hidden])) #scriptButton { @apply bg-primary/15 text-primary; }
  .tree { @apply flex-1 overflow-auto py-1 rounded-md bg-base-300 border border-white/5 select-none; }
  .tree summary { @apply block px-2 py-0.5 cursor-pointer list-none text-base-content/60 hover:text-base-content; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: '▸ '; } .tree details[open] > summary::before { content: '▾ '; }
  .tree details details > summary { @apply pl-5; }
  .tree .item { @apply py-0.5 pr-2 pl-[26px] cursor-pointer truncate hover:bg-white/5; }
  .tree .item.top { @apply pl-2; }
  .tree details details .item { @apply pl-10; }
  .tree .item.sel { @apply bg-primary/15 text-primary; }
  .tree .empty { @apply px-2.5 py-1 text-base-content/60; }
  #outline .item, #outline summary { @apply relative pr-7; }
  #outline .eye { @apply absolute right-1.5 top-1/2 grid -translate-y-1/2 cursor-pointer text-base-content/60 opacity-0 hover:text-base-content; }
  #outline :hover > .eye, #outline .eye.shown { @apply opacity-100; }   /* on hover, and always while something under it is hidden */
  .dropdown-content label { @apply flex items-center gap-2 px-2 py-1 rounded-md cursor-pointer hover:bg-white/5; }
  .select > button { display: contents; } .select > button > span { @apply min-w-0 truncate; }
  /* lists that open over the panels stand out from them: lighter, edged, shadowed (daisyUI's own is the panel's colour) */
  :is(.select, .select select)::picker(select) { @apply border-white/10 bg-neutral shadow-xl shadow-black/50; }
  .doc { @apply overflow-auto rounded-md border border-white/5 bg-base-200 px-3 py-2 text-xs leading-relaxed text-base-content/80; }
  .doc h2 { @apply mb-2 text-sm font-semibold text-base-content; }
  .doc h3 { @apply mt-4 mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-base-content/60; }
  .doc p, .doc pre, .doc table { @apply mb-3; }
  .doc strong { @apply text-base-content; }
  .doc code { @apply rounded bg-base-300 px-1 font-mono text-[11px] text-base-content; }
  .doc pre { @apply overflow-auto rounded-md bg-base-300 p-2; } .doc pre code { @apply bg-transparent p-0; }
  .doc table { @apply w-full border-collapse; }
  .doc th, .doc td { @apply border-b border-base-300 px-1.5 py-1 text-left align-top; } .doc th { @apply font-semibold text-base-content/60; }
  #status { @apply truncate; } #status.ok { @apply text-success; } #status.warn { @apply text-warning; }
  /* ui.js tooltips(): a popover, so it sits above menus and dialogs; placed by left/top */
  #tip { @apply pointer-events-none fixed m-0 max-w-72 rounded-md border border-white/10 bg-neutral px-2 py-1.5 text-xs leading-snug text-base-content shadow-xl; inset: auto; }
  #tip:popover-open { animation: tip-in .1s ease-out; }
  #tip .keys { @apply ml-1.5 inline-flex gap-0.5 align-middle; }
  #tip p { @apply mt-1 text-base-content/60; }
  @keyframes tip-in { from { opacity: 0; } }
</style>
<style>
  [data-theme=rlme] {
    color-scheme: dark;
    --color-base-100: #1a1d23; --color-base-200: #15171c; --color-base-300: #0f1114; --color-base-content: #e7e9ec;
    --color-primary: #4da3ff; --color-primary-content: #06121f; --color-secondary: #a78bfa; --color-secondary-content: #110a24;
    --color-accent: #4da3ff; --color-accent-content: #06121f; --color-neutral: #232832; --color-neutral-content: #e7e9ec;
    --color-info: #4da3ff; --color-info-content: #06121f; --color-success: #5fd38d; --color-success-content: #05180d;
    --color-warning: #ffb547; --color-warning-content: #231500; --color-error: #ff8a7a; --color-error-content: #2a0904;
    --radius-selector: .25rem; --radius-field: .375rem; --radius-box: .5rem;
    --size-selector: .22rem; --size-field: .22rem; --border: 1px; --depth: 0; --noise: 0;
  }
</style>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--color-base-300); color: var(--color-base-content); }   /* html keeps 16px: Tailwind's rem sizes */
  #app { display: grid; height: 100%; grid-template: "top top top" 46px "left view right" 1fr "foot foot foot" 26px / 250px 1fr 280px; }
  /* while the map from before a reload comes back (restoreSession): skeletons in the panels, a message over the view */
  #app:not(.booting) .boot-only, #app.booting .boot-hide { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "preact": "https://cdn.jsdelivr.net/npm/preact@11.0.1/dist/preact.mjs",
  "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@11.0.1/hooks/dist/hooks.mjs",
  "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js",
  "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js",
  "htm/preact": "https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/index.module.js",
  "@preact/signals": "https://cdn.jsdelivr.net/npm/@preact/signals@2.11.3/dist/signals.module.js",
  "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.4/dist/signals-core.module.js"
} }
</script>
</head>
<body>
<div id="app" class="booting">
  <header id="toolbar" class="[grid-area:top] flex items-center justify-between gap-4 px-2 min-w-0 bg-base-100 border-b border-base-300"></header>

  <aside id="left" class="[grid-area:left] flex flex-col gap-2 p-2.5 min-h-0 overflow-hidden bg-base-100 border-r border-base-300">
    <div id="leftPanel" class="contents"></div>
    <div class="boot-only flex flex-1 flex-col gap-3 rounded-md border border-white/5 bg-base-300 p-2.5 [&>div]:h-3 [&>div]:bg-base-100">
      <div class="skeleton w-3/5"></div><div class="skeleton w-1/2"></div><div class="skeleton w-4/5"></div><div class="skeleton w-2/3"></div>
      <div class="skeleton w-1/2"></div><div class="skeleton w-3/4"></div><div class="skeleton w-2/5"></div>
    </div>
  </aside>

  <main id="view" class="[grid-area:view] relative overflow-hidden">
    <!-- position inline: it shows before Tailwind has run -->
    <div class="boot-only grid place-items-center" style="position: absolute; inset: 0; z-index: 6; background: var(--color-base-300)">
      <div class="flex max-w-md flex-col items-center gap-3 text-center text-base-content/60"><span class="loading loading-spinner loading-md text-primary"></span><span id="bootText">Loading…</span>
        <div id="bootStuck" class="flex flex-col items-center gap-2" hidden>
          <span id="bootError" class="font-mono text-xs text-error" hidden></span>
          <button id="bootReset" class="btn btn-sm">Start fresh</button>
          <span class="text-xs">Forgets the map kept from last time and the offline copy, then reloads. Your files, pieces and library stay.</span>
        </div>
      </div>
    </div>
    <div id="loadingMount" class="contents"></div>
    <div id="scriptTexts" class="pointer-events-none absolute inset-0 overflow-hidden"></div>
    <div id="scriptMount" class="contents"></div>
    <div id="dragInfo" class="pointer-events-none absolute whitespace-nowrap rounded bg-base-300/85 px-1.5 font-mono text-[11px] leading-snug" hidden></div>
    <div id="labels" class="pointer-events-none absolute inset-0 overflow-hidden" hidden><div id="legend" class="absolute bottom-2.5 left-2.5 flex items-center gap-2 rounded-box bg-base-300/80 px-2 py-0.5 text-xs"><span id="legendText"></span><span id="scaleBar" class="h-1 rounded-full bg-base-content"></span><span id="scaleText"></span></div></div>
    <input type="file" id="file" accept=".udk,.upk,.json,.glb,.gltf,.bin,.obj,.stl,image/*" multiple hidden>
  </main>

  <aside id="right" class="[grid-area:right] flex flex-col gap-4 p-3 overflow-auto bg-base-100 border-l border-base-300">
    <!-- field rows: a label column and the field; vector rows: a label and three fields; .active marks the picked button of a join -->
    <div class="boot-only flex flex-col gap-3">
      <div class="skeleton h-4 w-14"></div>
      <div class="flex flex-col gap-2"><div class="skeleton h-3 w-full"></div><div class="skeleton h-3 w-4/5"></div></div>
      <div class="mt-3 skeleton h-3 w-20"></div>
      <div class="flex items-center gap-2"><div class="skeleton h-3 w-16"></div><div class="skeleton h-7 flex-1"></div></div>
      <div class="mt-3 skeleton h-3 w-20"></div>
      <div class="flex items-center gap-2"><div class="skeleton size-4"></div><div class="skeleton h-3 w-16"></div></div>
      <div class="flex items-center gap-2"><div class="skeleton size-4"></div><div class="skeleton h-3 w-24"></div></div>
    </div>
    <section id="selection" class="boot-hide flex flex-col gap-3"></section>
    <section id="brush" class="flex flex-col gap-2"></section>
  </aside>

  <footer id="footer" class="[grid-area:foot] flex items-center justify-between gap-4 px-2.5 text-xs bg-base-100 border-t border-base-300 min-w-0"></footer>
</div>
<div id="overlays"></div>
<script>
  // A plain script, so it works when the modules don't: an error while starting, or 10 s without the editor up, offers a fresh start
  const stuck = why => {
    if (!document.getElementById('app').classList.contains('booting')) return;
    if (why) Object.assign(document.getElementById('bootError'), { textContent: why, hidden: false });
    document.getElementById('bootText').textContent = why ? "The editor didn't start." : 'This is taking longer than it should.';
    document.getElementById('bootStuck').hidden = false;
  };
  addEventListener('error', e => {   // capturing, to also hear a script file that failed to load
    const why = e.message || e.target.src && `${e.target.src.split('/').pop()} didn't load`;
    if (why) stuck(why);
  }, true);
  addEventListener('unhandledrejection', e => stuck(String(e.reason?.message ?? e.reason)));
  setTimeout(stuck, 10000);
  document.getElementById('bootReset').onclick = async () => {
    for (const r of await navigator.serviceWorker?.getRegistrations() ?? []) await r.unregister();
    for (const key of await caches.keys()) await caches.delete(key);
    await new Promise(done => Object.assign(indexedDB.deleteDatabase('rl-map-editor-session'), { onsuccess: done, onerror: done, onblocked: done }));
    location.reload();
  };
</script>
<script type="module" src="main.js"></script>
</body>
</html>
