<style type="text/tailwindcss">

  <aside id="right" class="[grid-area:right] flex flex-col gap-4 p-3 overflow-auto bg-base-100 border-l border-base-300">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Package } from './ue3.js';
import { blankMap } from './blank.js';
import { LIGHTING, build, describe, isOriginalGameMap, shapes, bareName } from './map.js';
import { BALL_AHEAD, BALL_FRONT_LIFT, BALL_LIFT, BALL_TOP_AHEAD } from './kismet.js';
import { LIGHT_FIELDS, LIGHT_KINDS } from './lights.js';
import { planNames, runScript } from './script.js';
import { MOTIONS, eulerRotator, keysAt, motionErrors, motionKeys, newMotion, scaledBox, ueAxes } from './motion.js';
import { CELL, SINK, TILE } from './mesh.js';
import { BUILT_IN, asMeshInput, corners, meshGeometry } from './shapes.js';
import { nameLook, surfaceLook, textureImage } from './looks.js';
import { textureSize } from './texture.js';
import { gameIndex, gameLook, openGame } from './game.js';
import { SNAP_STEPS, mountUI, ui } from './ui.js';

// Unreal is left-handed Z-up, Three.js right-handed Y-up: swapping Y and Z converts without mirroring.
const UU = Math.PI / 32768;                       // rotator units to radians
const toThree = v => new THREE.Vector3(v[0], v[2], v[1]);
const fromThree = v => [v.x, v.z, v.y];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

function ueToQuat(rot) {
  const [X, Y, Z] = ueAxes(rot);
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(toThree(X), toThree(Z), toThree(Y)));
}
function quatToUe(q) {                            // FMatrix::Rotator
  const c = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
  new THREE.Matrix4().makeRotationFromQuaternion(q).extractBasis(...c);
  const X = fromThree(c[0]), Z = fromThree(c[1]), Y = fromThree(c[2]);
  const pitch = Math.atan2(X[2], Math.hypot(X[0], X[1]));
  const yaw = Math.atan2(X[1], X[0]);
  const sy = [-Math.sin(yaw), Math.cos(yaw), 0];
  return [pitch, yaw, Math.atan2(dot(Z, sy), dot(Y, sy))].map(a => Math.round(a / UU));
}
for (const rot of [[0, 0, 0], [3160, 25980, -4096], [-5728, 64096, -5328], [0, -21504, 16384], [12000, -9000, 30000]]) {
  const back = ueAxes(quatToUe(ueToQuat(rot))), want = ueAxes(rot);
  console.assert(back.every((ax, i) => ax.every((v, k) => Math.abs(v - want[i][k]) < 1e-3)), 'rotation round trip failed', rot);
}

const $ = id => document.getElementById(id);
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111317);
const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x30343c, 2.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(0.4, 1, 0.3);
scene.add(sun);
let grid = null;
function fitGrid(reach = 50000) {                 // 1000-unit squares from the origin out to `reach` every way
  const size = 2 * Math.ceil(reach / 1000) * 1000;
  if (grid?.userData.size === size) return;
  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  grid = new THREE.GridHelper(size, size / 1000, 0x2a2f38, 0x1d2128);
  grid.userData.size = size;
  scene.add(grid);
}
fitGrid();
const camera = new THREE.PerspectiveCamera(60, 1, 10, 2e6);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
const gizmo = new TransformControls(camera, renderer.domElement);
gizmo.setSize(0.9);
scene.add(gizmo);
gizmo.addEventListener('dragging-changed', e => {
  orbit.enabled = !e.value;
  if (e.value) {
    pushUndo(selected);
    if (selected?.userData.ballSpawn) Object.assign(selected.userData, { placed: true, onRoof: false });
    drag = startDrag();
  } else {
    drag = null;
    endDrag();
    if (selected?.userData.spawn) settleSpawn(selected);
    if (selected?.userData.ballSpawn) settleBall(selected);
    scheduleOutline();
  }
});
// The gizmo drives a helper at the mesh's visible center; Unreal pivots can sit far away from the mesh.
const pivot = new THREE.Object3D(), pivotOffset = new THREE.Matrix4();
scene.add(pivot);
function boxOf(obj) {                             // the object's own shape, leaving out helpers such as arrows
  if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
  obj.updateMatrixWorld();
  return obj.geometry.boundingBox.clone().applyMatrix4(obj.matrixWorld);
}
function attachGizmo(obj) {
  pivot.position.copy(boxOf(obj).getCenter(new THREE.Vector3()));
  pivot.quaternion.copy(obj.quaternion);
  pivot.scale.copy(obj.scale);
  pivot.updateMatrixWorld();
  obj.updateMatrixWorld();
  pivotOffset.copy(pivot.matrixWorld).invert().multiply(obj.matrixWorld);
  gizmo.attach(pivot);
}
gizmo.addEventListener('objectChange', () => {
  if (drag) snapDrag();
  pivot.updateMatrixWorld();
  pivot.matrixWorld.clone().multiply(pivotOffset).decompose(selected.position, selected.quaternion, selected.scale);
  if (drag) showDrag();
  markDirty(selected);
  showSelection();
});

// Snapping (G) while dragging: a shape's lower corner lands on the grid, unless one of its faces or its middle comes
// within a few pixels of a nearby shape's, which it then lines up with. Sizes go in grid steps, yaw in 15° turns of
// the map (other rings 15° from where they started). ⌘ held while dragging snaps the other way for that moment.
// Scaling keeps the side across from the grabbed handle in place; scaling all ways keeps the bottom.
const TURN = THREE.MathUtils.degToRad(15), YAW_STEP = 65536 / 24, AXES = ['x', 'y', 'z'];
const UE_AXIS = { x: 'X', y: 'Z', z: 'Y' };      // three's axes by their Unreal names
let snapStep = 50, drag = null, freeDrag = false, dragAt = [0, 0];
window.addEventListener('pointermove', e => { freeDrag = e.metaKey || e.ctrlKey; dragAt = [e.clientX, e.clientY]; }, true);
const snapping = () => ui.snap.value !== freeDrag;
const guideGeo = new THREE.BoxGeometry(1, 1, 1), guideEdges = new THREE.EdgesGeometry(guideGeo);
const guideFill = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.18, depthWrite: false });
const guideLine = new THREE.LineBasicMaterial({ color: 0x00e5ff, depthTest: false });   // over the shape's own edges
const snapGuides = AXES.map(() => {                // the shape being lined up with, one per snapped axis
  const g = new THREE.Mesh(guideGeo, guideFill);
  g.add(new THREE.LineSegments(guideEdges, guideLine));
  g.visible = false;
  return g;
});
scene.add(...snapGuides);
const showGuide = (g, box) => {
  box.getCenter(g.position);
  box.getSize(g.scale).addScalar(4);
  g.visible = true;
};
let snapGrid = null;
function startDrag() {
  if (!selected) return null;
  const others = objects.filter(o => o !== selected && o.visible && o.userData.actor.bounds && !o.userData.deleted &&
                                     !o.userData.respawnFor && !o.userData.spawn && !o.userData.ballSpawn);
  return { pos: pivot.position.clone(), quat: pivot.quaternion.clone(), scale: pivot.scale.clone(), box: boxOf(selected),
           size: selected.geometry.boundingBox.getSize(new THREE.Vector3()), others: others.map(boxOf),
           grab: gizmo.pointStart.clone().applyQuaternion(pivot.quaternion.clone().invert()) };   // which end of a scale axis
}
function snapDrag() {
  const used = AXES.filter(c => gizmo.axis.includes(c.toUpperCase()));
  for (const g of snapGuides) g.visible = false;
  if (gizmo.mode === 'translate') { if (snapping()) snapMove(used); }
  else if (gizmo.mode === 'scale') snapSize(used);
  else if (snapping()) snapTurn();
}
function snapMove(used) {
  const box = drag.box.clone().translate(pivot.position.clone().sub(drag.pos));
  const near = box.clone().expandByScalar(1000 + box.getSize(new THREE.Vector3()).length());
  const others = drag.others.filter(b => b.intersectsBox(near)), tol = 8 * pixelAt(pivot.position);
  const mid = (b, c) => (b.min[c] + b.max[c]) / 2;
  used.forEach((c, n) => {
    let best = null;
    for (const b of others) {
      for (const d of [b.min[c] - box.min[c], b.min[c] - box.max[c], b.max[c] - box.min[c], b.max[c] - box.max[c], mid(b, c) - mid(box, c)]) {
        if (Math.abs(d) < tol && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, b };
      }
    }
    const d = best ? best.d : Math.round(box.min[c] / snapStep) * snapStep - box.min[c];
    pivot.position[c] += d;
    box.min[c] += d;
    box.max[c] += d;
    if (best) showGuide(snapGuides[n], best.b);
  });
}
function snapSize(used) {
  const s = pivot.scale, start = drag.scale, size = drag.size;
  if (snapping() && used.length === 3) {          // the longest side in whole steps, the others in proportion
    const longest = Math.max(...AXES.map(c => size[c] * Math.abs(start[c])));
    const f = Math.max(snapStep, Math.round(longest * s.x / start.x / snapStep) * snapStep) / longest;
    s.copy(start).multiplyScalar(f);
  } else if (snapping()) {
    for (const c of used) s[c] = Math.sign(s[c] || 1) * Math.max(snapStep, Math.round(size[c] * Math.abs(s[c]) / snapStep) * snapStep) / size[c];
  }
  pivot.position.copy(drag.pos);
  if (used.length === 3) pivot.position.y += (drag.pos.y - drag.box.min.y) * (s.x / start.x - 1);
  else for (const c of used) {
    const grown = size[c] * (Math.abs(s[c]) - Math.abs(start[c])), dir = new THREE.Vector3().setComponent(AXES.indexOf(c), 1);
    pivot.position.addScaledVector(dir.applyQuaternion(drag.quat), Math.sign(drag.grab[c] || 1) * grown / 2);
  }
}
function snapTurn() {
  if (gizmo.axis === 'Y') {                       // about the up axis only yaw changes: whole steps of it
    const r = quatToUe(pivot.quaternion);
    r[1] = Math.round(r[1] / YAW_STEP) * YAW_STEP;
    pivot.quaternion.copy(ueToQuat(r));
  } else pivot.quaternion.setFromAxisAngle(gizmo.rotationAxis, Math.round(gizmo.rotationAngle / TURN) * TURN).multiply(drag.quat);
}
const pixelAt = p => 2 * camera.position.distanceTo(p) * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / view.clientHeight;
function showDrag() {                             // the grid being snapped to, and what the drag has done so far
  const box = boxOf(selected), gridded = snapping() && gizmo.mode !== 'rotate';
  if (snapGrid?.userData.step !== snapStep) {
    if (snapGrid) { scene.remove(snapGrid); snapGrid.geometry.dispose(); snapGrid.material.dispose(); }
    snapGrid = new THREE.GridHelper(snapStep * 40, 40, 0x00e5ff, 0x00e5ff);
    Object.assign(snapGrid.material, { transparent: true, opacity: 0.45 });
    snapGrid.userData.step = snapStep;
    scene.add(snapGrid);
  }
  snapGrid.visible = gridded;
  snapGrid.position.set(Math.round(box.min.x / snapStep) * snapStep, box.min.y + 1, Math.round(box.min.z / snapStep) * snapStep);
  const used = AXES.filter(c => gizmo.axis.includes(c.toUpperCase())), moved = pivot.position.clone().sub(drag.pos);
  const signed = v => `${v > 0 ? '+' : ''}${Math.round(v)}`;

const pointer = new THREE.Vector2(), ray = new THREE.Raycaster();

  downAt = [e.clientX, e.clientY];

  const c = ter.cell;

  const hits = ray.intersectObjects(objects.filter(o => o.visible), false);
  // the nearest shape or checkpoint; other zones (lava over the whole floor, huge volumes) only when nothing else is there
  const clickable = o => !isVolume(o.userData.actor) || (o.userData.checkpoint && !o.userData.lava) || o.userData.zone;
  const hit = hits.find(h => clickable(h.object)) || hits[0];

function focus() {

  const d = Math.max(box.getSize(new THREE.Vector3()).length() * 1.6, 800);

function flyCamera(dt) {

  forward.normalize();

const typing = el => el.tagName === 'SELECT' || (el.tagName === 'INPUT' && !['range', 'checkbox'].includes(el.type));

window.addEventListener('blur', () => held.clear());
window.addEventListener('keydown', e => {
